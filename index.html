<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e7f0ed">
  <meta name="description" content="Полноэкранная интерактивная 3D-презентация о морфологии головного мозга. Анатомическая модель BodyParts3D, прозрачные структуры, 10 глав.">
  <title>Морфология головного мозга · NEURO 3D</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
  <script src="content-data.js" defer></script>
  <script src="anatomy-fallback.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="experience" class="experience" data-panel="open">
  <div id="brainViewport" class="brain-viewport" role="group" aria-label="Интерактивная 3D-модель головного мозга">
    <div id="brainCanvas" class="brain-canvas"></div>
    <div id="fallback" class="brain-fallback" aria-live="polite">
      <div class="fallback-art" id="fallbackArt"></div>
      <p id="modelStatus">Загрузка анатомической 3D-модели…</p>
    </div>
  </div>
  <div class="background-haze" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-symbol" aria-hidden="true">◉</span><span><b>NEURO</b><small>3D АТЛАС</small></span></div>
    <div class="header-actions">
      <button type="button" class="top-action" id="togglePanel" aria-expanded="true" aria-label="Скрыть текст" aria-controls="lessonPanel">◧ <span>Скрыть текст</span></button>
      <button type="button" class="top-action" id="notesButton" title="Заметки ведущего (N)">Заметки</button>
      <button type="button" class="top-action" id="sourcesButton">Источники</button>
      <button type="button" class="top-action icon" id="fullscreenButton" aria-label="На весь экран (F)" title="Полный экран (F)">⛶</button>
    </div>
  </header>
  <main id="lessonPanel" class="lesson-panel" tabindex="-1" aria-label="Текст текущей главы">
    <div id="lessonInner" class="lesson-inner" aria-live="polite"></div>
  </main>
  <div class="scene-caption" id="sceneCaption" aria-live="polite"></div>
  <div class="model-tools" role="group" aria-label="Управление 3D-моделью">
    <button type="button" id="spinButton" class="tool-button" aria-pressed="true" title="Приостановить вращение">⟳ <span>Вращение</span></button>
    <button type="button" id="resetButton" class="tool-button" title="Сбросить ракурс">⌖ <span>Ракурс</span></button>
    <button type="button" id="zoomIn" class="tool-button icon" aria-label="Приблизить модель">＋</button>
    <button type="button" id="zoomOut" class="tool-button icon" aria-label="Отдалить модель">−</button>
  </div>
  <footer class="bottom-nav" aria-label="Навигация по главам">
    <div class="chapter-index"><strong id="slideCount">01 <span>/ 10</span></strong><small id="slideName">Введение</small></div>
    <div class="chapter-timeline" id="timeline" role="group" aria-label="Выберите слайд"></div>
    <div class="arrows"><button type="button" id="backButton" aria-label="Предыдущая глава">←</button><button type="button" id="forwardButton" aria-label="Следующая глава">→</button></div>
  </footer>
  <div class="credit-line">3D-анатомия: BodyParts3D / DBCLS · CC BY-SA 2.1 JP</div>
  <dialog id="infoDialog" class="info-dialog"><button type="button" class="close-dialog" id="closeDialog" aria-label="Закрыть">×</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></dialog>
</div>
<script type="module" src="brain3d.js"></script>
</body>
</html>
